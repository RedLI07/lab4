name: CI

on:
  push:
    branches: [main, 'experiment/**']
    tags: ['*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  APP_PORT: '8109'
  PYTHONUNBUFFERED: '1'

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/experiment/')
    runs-on: ubuntu-24.04
    container: python:3.12.7-slim
    continue-on-error: ${{ startsWith(github.head_ref || github.ref_name, 'experiment/') }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: python --version
      - run: python -c 'import os; print("Commit:", os.environ["GITHUB_SHA"])'
      - run: python ci/validate.py

  unit_tests:
    needs: validate
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    container: python:3.12.7-slim
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: python -m unittest discover -s tests -v

  package:
    needs: [validate, unit_tests]
    if: >-
      !cancelled() && (startsWith(github.ref, 'refs/tags/') ||
      (github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.unit_tests.result == 'success'))
    runs-on: ubuntu-24.04
    container: python:3.12.7-slim
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: python ci/package.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: disk-check-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
